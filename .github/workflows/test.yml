name: KodBox plugin CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vue-app/package-lock.json
      - name: Install
        working-directory: vue-app
        run: npm ci --no-audit --no-fund
      - name: Vue typecheck and asset build
        working-directory: vue-app
        run: npm run build:kodbox
      - name: Mobile confirm regression
        working-directory: vue-app
        run: npm run test:mobile-confirm
      - name: KodBox bridge regression
        run: node plugins/foldMemo/test-bridge.cjs
      - name: PHP syntax and server mock regression
        run: |
          php -l plugins/foldMemo/app.php
          php plugins/foldMemo/test-server.php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, zip, mbstring
      - name: FoldMemo updater security regression
        run: |
          php -r "exit(class_exists('ZipArchive') && function_exists('curl_init') ? 0 : 1);"
          php -l plugins/foldMemo/update-service.php
          php plugins/foldMemo/test-update.php
      - name: Verify build outputs
        run: |
          test -s plugins/foldMemo/static/app/index.html
          find plugins/foldMemo/static/app/assets -type f | grep -E '\.(js|css)$'
